[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "oribrink"
version = "0.1.0"
description = "Light-quant trading assistant backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "apscheduler==3.10.4",
  "sqlalchemy==2.0.35",
  "alembic==1.13.2",
  "greenlet>=3.1.1",
  "psycopg[binary]==3.2.13",
  "redis==5.0.8",
  "pydantic-settings==2.5.2",
  "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
  "black==24.8.0",
  "ruff==0.6.5",
  "mypy==1.11.2",
  "pytest==8.3.3",
]
rqdata = [
  "rqdatac",
]

[project.scripts]
oribrink-api = "services.api_service.cli:main"
oribrink-scheduler = "services.scheduler_service.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["services", "shared"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"services/api_service/*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
