[project]
name = "oribrink"
version = "0.1.0"
description = "A 股亢龙有悔 / 潜龙在渊识别与邮件提醒系统"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "akshare>=1.13",
    "typer>=0.12",
    "rich>=13.7",
    "pandas>=2.2",
    "pydantic>=2.6",
]

[project.scripts]
ob = "oribrink.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oribrink"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
